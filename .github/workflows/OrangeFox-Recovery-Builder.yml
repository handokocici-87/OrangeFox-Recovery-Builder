name: Build OrangeFox for Zircon

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Device Tree
        uses: actions/checkout@v4
        with:
          ref: twrp_15

      - name: Setup Build Environment
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git-core \
            gnupg \
            flex \
            bison \
            gperf \
            build-essential \
            zip \
            curl \
            zlib1g-dev \
            gcc-multilib \
            g++-multilib \
            libc6-dev-i386 \
            libncurses5-dev \
            lib32ncurses6 \
            x11proto-core-dev \
            libx11-dev \
            lib32z-dev \
            ccache \
            libgl1-mesa-dev \
            libxml2-utils \
            xsltproc \
            unzip \
            python3 \
            python-is-python3 \
            rsync \
            bc \
            lz4 \
            cpio

      - name: Initialize OrangeFox Source
        run: |
          mkdir -p "$GITHUB_WORKSPACE/fox"

          git clone --depth=1 \
            https://gitlab.com/OrangeFox/sync.git \
            "$GITHUB_WORKSPACE/OrangeFox_sync"

          cd "$GITHUB_WORKSPACE/OrangeFox_sync"

          chmod +x orangefox_sync.sh

          ./orangefox_sync.sh \
            --branch 14.1 \
            --path "$GITHUB_WORKSPACE/fox"

      - name: Add Zircon Device Tree
        run: |
          cd "$GITHUB_WORKSPACE/fox"

          mkdir -p device/xiaomi

          git clone \
            https://github.com/handokocici-87/android_device_xiaomi_zircon_twrp.git \
            -b twrp_15 \
            device/xiaomi/zircon

      - name: Sync Sources
        run: |
          cd "$GITHUB_WORKSPACE/fox"

          repo sync \
            -c \
            -j$(nproc --all) \
            --no-tags \
            --no-clone-bundle \
            --optimized-fetch \
            --prune \
            --force-sync

      - name: Build OrangeFox
        run: |
          cd "$GITHUB_WORKSPACE/fox"

          source build/envsetup.sh

          lunch omni_zircon-eng

          mka adbd recoveryimage

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-zircon-unofficial
          path: |
            fox/out/target/product/zircon/recovery.img
