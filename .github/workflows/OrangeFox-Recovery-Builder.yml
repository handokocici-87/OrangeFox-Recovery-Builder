name: Build OrangeFox Zircon

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      FOX_DIR: ${{ github.workspace }}/fox
      SYNC_DIR: ${{ github.workspace }}/OrangeFox_sync
      DEVICE_REPO: https://github.com/handokocici-87/android_device_xiaomi_zircon_twrp.git
      DEVICE_BRANCH: a15
      FOX_BRANCH: 12.1

    steps:

      # ============================================================
      # 1. CLEAN RUNNER
      # ============================================================
      - name: Free Runner Disk
        shell: bash
        run: |
          set -e

          echo "===== BEFORE CLEANUP ====="
          df -h /

          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/share/powershell
          sudo rm -rf /usr/local/share/chromium
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /opt/hostedtoolcache/node
          sudo rm -rf /usr/local/share/vcpkg
          sudo rm -rf /usr/local/julia
          sudo rm -rf /usr/local/aws-cli

          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*

          echo "===== AFTER CLEANUP ====="
          df -h /

      # ============================================================
      # 2. INSTALL DEPENDENCIES
      # ============================================================
      - name: Setup Build Environment
        shell: bash
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            git \
            git-lfs \
            gnupg \
            flex \
            bison \
            gperf \
            build-essential \
            zip \
            unzip \
            curl \
            wget \
            zlib1g-dev \
            gcc-multilib \
            g++-multilib \
            libc6-dev-i386 \
            libncurses5-dev \
            lib32ncurses6 \
            x11proto-core-dev \
            libx11-dev \
            lib32z-dev \
            ccache \
            libgl1-mesa-dev \
            libxml2-utils \
            xsltproc \
            python3 \
            python-is-python3 \
            rsync \
            bc \
            lz4 \
            cpio \
            libssl-dev \
            libelf-dev \
            schedtool

          git lfs install --system

          echo "===== GIT ====="
          git --version

      # ============================================================
      # 3. INSTALL REPO
      # ============================================================
      - name: Install Repo
        shell: bash
        run: |
          set -e

          sudo curl -fsSL \
            https://storage.googleapis.com/git-repo-downloads/repo \
            -o /usr/local/bin/repo

          sudo chmod +x /usr/local/bin/repo

          echo "===== REPO ====="
          command -v repo
          repo --version

      # ============================================================
      # 4. GIT CONFIG
      # ============================================================
      - name: Configure Git
        shell: bash
        run: |
          set -e

          git config --global user.name "OrangeFox Builder"
          git config --global user.email "orangefox-builder@localhost"

          git config --global protocol.version 1
          git config --global core.compression 0

      # ============================================================
      # 5. CHECK STORAGE
      # ============================================================
      - name: Check Storage
        shell: bash
        run: |
          set -e

          echo "===== AVAILABLE STORAGE ====="
          df -h /

          AVAILABLE_GB=$(df -BG / | awk 'NR==2 {gsub("G","",$4); print $4}')

          echo "Available: ${AVAILABLE_GB} GB"

          if [ "$AVAILABLE_GB" -lt 40 ]; then
            echo ""
            echo "======================================================"
            echo "STOP: GitHub runner does not have enough disk space."
            echo "OrangeFox 12.1 requires approximately 45 GB."
            echo "This runner currently has only ${AVAILABLE_GB} GB."
            echo "======================================================"
            echo ""
            exit 1
          fi

      # ============================================================
      # 6. VERIFY DEVICE TREE
      # ============================================================
      - name: Verify Zircon Device Tree
        shell: bash
        run: |
          set -e

          echo "Checking device tree branch..."

          git ls-remote \
            --exit-code \
            --heads \
            "$DEVICE_REPO" \
            "refs/heads/$DEVICE_BRANCH"

          echo "Device tree branch '$DEVICE_BRANCH' exists."

      # ============================================================
      # 7. CLONE ORANGEFOX SYNC TOOL
      # ============================================================
      - name: Get OrangeFox Sync Tool
        shell: bash
        run: |
          set -e

          rm -rf "$SYNC_DIR"

          git clone \
            --depth=1 \
            https://gitlab.com/OrangeFox/sync.git \
            "$SYNC_DIR"

          cd "$SYNC_DIR"

          chmod +x orangefox_sync.sh

          echo "===== ORANGEFOX SYNC TOOL ====="
          ./orangefox_sync.sh --help

      # ============================================================
      # 8. SYNC ORANGEFOX 12.1
      # ============================================================
      - name: Sync OrangeFox Sources
        shell: bash
        run: |
          set -e

          rm -rf "$FOX_DIR"
          mkdir -p "$FOX_DIR"

          cd "$SYNC_DIR"

          ./orangefox_sync.sh \
            --branch "$FOX_BRANCH" \
            --path "$FOX_DIR"

      # ============================================================
      # 9. ADD ZIRCON DEVICE TREE
      # ============================================================
      - name: Add Zircon Device Tree
        shell: bash
        run: |
          set -e

          mkdir -p "$FOX_DIR/device/xiaomi"

          rm -rf "$FOX_DIR/device/xiaomi/zircon"

          git clone \
            --depth=1 \
            --branch "$DEVICE_BRANCH" \
            "$DEVICE_REPO" \
            "$FOX_DIR/device/xiaomi/zircon"

          echo "===== ZIRCON DEVICE TREE ====="
          ls -la "$FOX_DIR/device/xiaomi/zircon"

      # ============================================================
      # 10. VERIFY DEVICE TREE
      # ============================================================
      - name: Verify Zircon Files
        shell: bash
        run: |
          set -e

          cd "$FOX_DIR/device/xiaomi/zircon"

          echo "===== DEVICE TREE FILES ====="

          test -f AndroidProducts.mk
          test -f BoardConfig.mk
          test -f device.mk
          test -f twrp_zircon.mk
          test -f fox_zircon.mk

          echo "All required Zircon files found."

          echo ""
          echo "===== AndroidProducts.mk ====="
          cat AndroidProducts.mk

          echo ""
          echo "===== fox_zircon.mk ====="
          cat fox_zircon.mk

      # ============================================================
      # 11. PREPARE BUILD ENVIRONMENT
      # ============================================================
      - name: Prepare Build Environment
        shell: bash
        run: |
          set -e

          cd "$FOX_DIR"

          export ALLOW_MISSING_DEPENDENCIES=true

          source build/envsetup.sh

          echo "===== BUILD SYSTEM ====="
          echo "TOP=$ANDROID_BUILD_TOP"

          echo ""
          echo "===== ZIRCON PRODUCTS ====="

          if command -v list_products >/dev/null 2>&1; then
            list_products 2>/dev/null | grep -i zircon || true
          fi

          echo ""
          echo "===== ZIRCON LUNCH TARGETS ====="

          TARGETS="$(
            TARGET_BUILD_APPS= \
            get_build_var COMMON_LUNCH_CHOICES 2>/dev/null \
            | tr ' ' '\n' \
            | grep -i zircon \
            || true
          )"

          printf '%s\n' "$TARGETS"

          echo "$TARGETS" > /tmp/zircon_lunch_targets

      # ============================================================
      # 12. AUTOMATICALLY FIND VALID LUNCH TARGET
      # ============================================================
      - name: Select Valid Zircon Lunch Target
        shell: bash
        run: |
          set -e

          cd "$FOX_DIR"

          export ALLOW_MISSING_DEPENDENCIES=true

          source build/envsetup.sh

          echo "===== SEARCHING FOR VALID ZIRCON TARGET ====="

          FOUND=""

          # First try targets advertised by the build system.
          while IFS= read -r TARGET; do

            [ -z "$TARGET" ] && continue

            echo "Testing: $TARGET"

            if lunch "$TARGET" >/tmp/lunch_test.log 2>&1; then
              FOUND="$TARGET"
              echo "VALID TARGET: $FOUND"
              break
            fi

            cat /tmp/lunch_test.log || true

          done < /tmp/zircon_lunch_targets

          # Fallback candidates for modern Android build systems.
          if [ -z "$FOUND" ]; then

            CANDIDATES="
            fox_zircon-ap2a-eng
            orangefox_zircon-ap2a-eng
            twrp_zircon-ap2a-eng
            fox_zircon-ap1a-eng
            orangefox_zircon-ap1a-eng
            twrp_zircon-ap1a-eng
            "

            for TARGET in $CANDIDATES; do

              echo "Testing fallback: $TARGET"

              if lunch "$TARGET" >/tmp/lunch_test.log 2>&1; then
                FOUND="$TARGET"
                echo "VALID FALLBACK TARGET: $FOUND"
                break
              fi

            done

          fi

          if [ -z "$FOUND" ]; then
            echo ""
            echo "======================================================"
            echo "ERROR: No valid Zircon lunch target was found."
            echo "======================================================"
            echo ""
            echo "AndroidProducts.mk:"
            cat device/xiaomi/zircon/AndroidProducts.mk
            echo ""
            echo "Available products:"
            list_products 2>/dev/null | grep -i zircon || true
            echo ""
            echo "Available lunch choices:"
            TARGET_BUILD_APPS= get_build_var COMMON_LUNCH_CHOICES 2>/dev/null \
              | tr ' ' '\n' \
              | grep -i zircon || true
            exit 1
          fi

          echo "$FOUND" > "$GITHUB_WORKSPACE/zircon_lunch_target.txt"

          echo ""
          echo "SELECTED:"
          cat "$GITHUB_WORKSPACE/zircon_lunch_target.txt"

      # ============================================================
      # 13. BUILD VENDOR_BOOT
      # ============================================================
      - name: Build OrangeFox Vendor Boot
        shell: bash
        run: |
          set -e

          cd "$FOX_DIR"

          export ALLOW_MISSING_DEPENDENCIES=true
          export USE_CCACHE=1
          export CCACHE_EXEC=/usr/bin/ccache

          mkdir -p "$HOME/.ccache"
          ccache -M 2G || true

          source build/envsetup.sh

          TARGET="$(cat "$GITHUB_WORKSPACE/zircon_lunch_target.txt")"

          echo "===== FINAL LUNCH TARGET ====="
          echo "$TARGET"

          lunch "$TARGET"

          echo ""
          echo "===== BUILD VARIABLES ====="
          echo "TARGET_PRODUCT=$(get_build_var TARGET_PRODUCT)"
          echo "TARGET_DEVICE=$(get_build_var TARGET_DEVICE)"
          echo "TARGET_RELEASE=$(get_build_var TARGET_RELEASE)"
          echo "TARGET_BUILD_VARIANT=$(get_build_var TARGET_BUILD_VARIANT)"

          echo ""
          echo "===== BUILD VENDOR_BOOT ====="

          mka vendorbootimage -j2

      # ============================================================
      # 14. FIND RESULT
      # ============================================================
      - name: Verify Output
        shell: bash
        run: |
          set -e

          PRODUCT_DIR="$FOX_DIR/out/target/product/zircon"

          echo "===== OUTPUT DIRECTORY ====="
          ls -lah "$PRODUCT_DIR"

          echo ""
          echo "===== SEARCHING FOR IMAGES ====="

          find "$PRODUCT_DIR" \
            -maxdepth 1 \
            -type f \
            \( \
              -name "vendor_boot.img" \
              -o -name "OrangeFox*.img" \
              -o -name "recovery.img" \
            \) \
            -print

          if [ -f "$PRODUCT_DIR/vendor_boot.img" ]; then
            echo ""
            echo "SUCCESS: vendor_boot.img found."
            ls -lh "$PRODUCT_DIR/vendor_boot.img"
            exit 0
          fi

          FOX_IMAGE="$(find "$PRODUCT_DIR" -maxdepth 1 -type f -name 'OrangeFox*.img' | head -n1 || true)"

          if [ -n "$FOX_IMAGE" ]; then
            echo ""
            echo "SUCCESS: OrangeFox image found:"
            echo "$FOX_IMAGE"
            exit 0
          fi

          echo ""
          echo "ERROR: No OrangeFox/vendor_boot image found."
          exit 1

      # ============================================================
      # 15. UPLOAD RESULT
      # ============================================================
      - name: Upload OrangeFox
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-zircon
          path: |
            fox/out/target/product/zircon/vendor_boot.img
            fox/out/target/product/zircon/OrangeFox*.img
          if-no-files-found: error
          retention-days: 7

      # ============================================================
      # 16. UPLOAD LOGS ON FAILURE
      # ============================================================
      - name: Upload Build Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-zircon-failure-logs
          path: |
            fox/out/target/product/zircon
            fox/out
            /tmp/lunch_test.log
          if-no-files-found: ignore
          retention-days: 3=====================================================
      - name: Upload Build Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-zircon-build-logs
          path: |
            fox/out/target/product/zircon
            fox/out
          if-no-files-found: ignore
          retention-days: 3
