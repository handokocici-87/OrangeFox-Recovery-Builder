name: Build OrangeFox for Zircon (A15 Base)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Device Tree
      uses: actions/checkout@v4
      with:
        ref: twrp_15
      
    - name: Setup Build Environment
      run: |
        sudo apt-get update
        sudo apt-get install -y git-core gnupg flex bison gperf build-essential zip curl zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 lib32ncurses5-dev x11proto-core-dev libx11-dev lib32z-dev ccache libgl1-mesa-dev libxml2-utils xsltproc unzip python3 repo
        
    - name: Initialize OrangeFox Source
      run: |
        mkdir fox && cd fox
        repo init -u https://gitlab.com/OrangeFox/sync.git -b fox_14.1 --depth=1
        # Username sudah diisi otomatis: handokocici-87
        echo '<project path="device/xiaomi/zircon" name="handokocici-87/android_device_xiaomi_zircon_twrp" remote="github" revision="twrp_15" />' >> .repo/local_manifests/roomservice.xml
        
    - name: Sync Sources
      run: |
        cd fox
        repo sync -c -j$(nproc --all) --no-tags --no-clone-bundle --optimized-fetch --prune --force-sync
        
    - name: Build OrangeFox
      run: |
        cd fox
        source build/envsetup.sh
        # PERBAIKAN KUNCI: Menggunakan prefix 'twrp_' sesuai device tree asli
        lunch twrp_zircon-eng
        mka adbd recoveryimage
        
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: OrangeFox-zircon-unofficial
        path: fox/out/target/product/zircon/recovery.img
